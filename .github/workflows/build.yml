name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  rpm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # aarch64 is what this is developed and tested on; armv7hl covers
        # the older devices and is built blind.
        arch: [aarch64, armv7hl]
    steps:
      - uses: actions/checkout@v4

      - name: Build the RPM
        uses: coderus/github-sfos-build@sfos5
        with:
          release: 5.1.0.11
          arch: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: RPMS/*.rpm
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: rpm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          merge-multiple: true
          path: rpms

      - uses: softprops/action-gh-release@v2
        with:
          files: rpms/*.rpm
          # Unsigned builds off a CI runner, not Store packages - say so
          # where somebody downloading them will see it.
          body: |
            Unsigned RPMs built by GitHub Actions for Sailfish OS 5.1.0.11,
            aarch64 and armv7hl.

            Install with `devel-su pkcon install-local <file>.rpm`, which
            will warn that the package is untrusted. It is right: these are
            CI builds, not Store packages.
